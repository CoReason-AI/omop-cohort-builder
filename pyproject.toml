[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omop_cohort_builder"
version = "0.1.0"
description = "A Python library for building OHDSI Circe cohort definitions"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
]
requires-python = ">=3.9"

[project.optional-dependencies]
test = [
    "pytest",
    "pytest-cov",
    "pytest-snapshot",
]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100
