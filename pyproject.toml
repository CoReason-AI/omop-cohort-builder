[tool.poetry]
name = "omop_cohort_builder"
version = "0.1.0"
description = "A Python library for building OHDSI Circe cohort definitions"
authors = ["Admin <admin@example.com>"]
packages = [{include = "omop_cohort_builder", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pydantic = "^2.0"
sqlalchemy = "^2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^6.0"
pytest-snapshot = "^0.9.0"
pre-commit = "^4.0"
mypy = "^1.8"
mkdocs = "^1.5"
mkdocs-material = "^9.5"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
addopts = "--cov=omop_cohort_builder --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true
